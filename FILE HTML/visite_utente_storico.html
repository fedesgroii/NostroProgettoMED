<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico delle visite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Stili di base */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f2f2f2;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow-x: hidden;
        }

        .container {
            padding-bottom: 60px; /* Distanza per fare spazio al footer fisso */
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: calc(100vh - 60px); /* Riduci altezza per il footer */
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ccc;
        }

        .header a {
            text-decoration: none;
            color: #333;
            font-size: 1.5em;
            margin: 0 10px;
        }

        /* Sezione tabs */
        .tabs {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .tab {
            margin: 0 10px;
            padding: 8px 20px;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: border-bottom 0.3s;
        }

        .tab.active {
            border-bottom: 2px solid #28a745;
        }

        /* Lista delle visite storiche */
        .history-list {
            text-align: left;
            margin: 20px 0;
        }

        .history-item {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            transition: box-shadow 0.3s;
        }

        .history-item:hover {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .history-item h3 {
            margin: 0 0 10px 0;
            color: #28a745;
        }

        .history-item p {
            margin: 5px 0;
            color: #333;
        }

        /* Footer */
        .footer {
            position: fixed; /* Posiziona il footer in modo fisso */
            bottom: 0; /* Ancorato alla parte inferiore della pagina */
            left: 0; /* Allinea a sinistra */
            width: 100%; /* Occupa tutta la larghezza */
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #ccc;
            background-color: #f2f2f2;
            z-index: 10; /* Assicurati che sia sopra il contenuto */
        }

        .footer a {
            text-decoration: none;
            color: #333;
            text-align: center;
            font-size: 1.2em;
        }

        .footer a.active {
            color: #28a745;
            font-weight: bold;
        }

        .footer-line {
            width: 100%;
            height: 2px;
            background-color: #ccc;
            position: absolute;
            bottom: -1px;
            left: 0;
        }

        /* Centrare il titolo */
        .title-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
        }

        h1 {
            font-size: 2em;
            color: #333;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <a href="/Users/Federico/Desktop/ISPW/FILE%20HTML%20COMPITO/impostazioni_utente.html"><i class="fas fa-user"></i></a>
            </div>
            <div class="header-right">
                <a href="/Users/Federico/Desktop/ISPW/FILE%20HTML%20COMPITO/impostazioni_app.html"><i class="fas fa-cog"></i></a>
                <a href="/Users/Federico/Desktop/ISPW/FILE%20HTML%20COMPITO/privacy_policy.html"><i class="fas fa-shield-alt"></i></a>
            </div>
        </div>

        <!-- Titolo centrato -->
        <div class="title-container">
            <h1>Storico delle visite</h1>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          <div class="tab" onclick="location.href='/Users/Federico/Desktop/ISPW/FILE%20HTML%20COMPITO/visite_utente_attive.html'">Attive</div>
          <div class="tab active" onclick="location.href='/Users/Federico/Desktop/ISPW/FILE%20HTML%20COMPITO/visite_utente_storico.html'">Storico</div>
        </div>

        <!-- Lista delle visite storiche -->

    </div>

    <!-- Footer -->
    <div class="footer">
        <a href="/Users/Federico/Desktop/ISPW/FILE%20HTML%20COMPITO/bacheca_utente.html">Bacheca</a>
        <a href="/Users/Federico/Desktop/ISPW/FILE%20HTML%20COMPITO/home_paziente.html">Home</a>
        <a href="/Users/Federico/Desktop/ISPW/FILE%20HTML%20COMPITO/visite_utente_storico.html" class="active">Visite</a>
    </div>

</body>
</html>
