<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindLab - Seleziona Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f9fa;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            color: #1f2937;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 480px;
            max-height: 98vh;
            background-color: #ffffff;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .header img {
            width: 100px;
            height: auto;
            margin-bottom: 8px;
            object-fit: contain;
        }

        .header h1 {
            color: #111827;
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.025em;
        }

        /* Calendar Section */
        .calendar-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Custom Scrollbar */
        .calendar-wrapper::-webkit-scrollbar {
            width: 6px;
        }

        .calendar-wrapper::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 3px;
        }

        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            margin-bottom: 10px;
        }

        .month-name {
            font-weight: 600;
            font-size: 1rem;
            text-transform: capitalize;
        }

        .nav-arrow {
            color: #6b7280;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            user-select: none;
        }

        .nav-arrow:hover {
            background-color: #f3f4f6;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            margin-bottom: 10px;
        }

        .weekday {
            font-size: 0.75rem;
            color: #9ca3af;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            color: #374151;
            position: relative;
        }

        .day:hover:not(.empty):not(.selected):not(.disabled) {
            background-color: #f3f4f6;
            color: #111827;
        }

        .day.selected {
            background-color: #2563eb;
            color: white;
            font-weight: 600;
        }

        .day.today {
            color: #2563eb;
            font-weight: 600;
        }

        .day.today::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            background-color: #2563eb;
            border-radius: 50%;
        }

        .day.selected.today {
            color: white;
        }

        .day.selected.today::after {
            background-color: white;
        }

        .day.empty {
            cursor: default;
        }

        .day.disabled {
            color: #d1d5db;
            cursor: not-allowed;
        }

        /* Time Slots Section */
        .time-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* 3 columns for cleaner look */
            gap: 10px;
        }

        .time-slot {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            text-align: center;
            font-size: 0.9rem;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
        }

        .time-slot:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .time-slot.selected {
            background-color: #eff6ff;
            border-color: #2563eb;
            color: #2563eb;
            font-weight: 600;
        }

        /* Footer */
        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #f3f4f6;
            flex-shrink: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            font-size: 0.85em;
            font-weight: 500;
            text-decoration: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .btn-cancel {
            background-color: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .btn-cancel:hover {
            background-color: #f9fafb;
            color: #111827;
            border-color: #9ca3af;
        }

        .btn-submit {
            background-color: #2563eb;
            color: #ffffff;
            border: 1px solid transparent;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="http://mypartyacfslove.altervista.org/logo_ML.png" alt="MindLab Logo">
            <h1>Seleziona Data e Ora</h1>
        </div>

        <!-- Main Content -->
        <div class="calendar-wrapper">

            <!-- Calendar Component -->
            <div id="calendar-component">
                <div class="month-selector">
                    <span class="nav-arrow" id="prev-month">&#10094;</span>
                    <span class="month-name" id="current-month-display"></span>
                    <span class="nav-arrow" id="next-month">&#10095;</span>
                </div>

                <div class="calendar-grid" id="calendar-grid">
                    <!-- Javascript will populate this -->
                </div>
            </div>

            <!-- Time Selection -->
            <div class="time-section">
                <div class="section-title">Orari Disponibili</div>
                <div class="time-grid" id="time-grid">
                    <!-- Javascript will populate this -->
                </div>
            </div>
        </div>

        <!-- Footer Buttons -->
        <div class="buttons">
            <a href="prenotazione_visita.html" class="btn btn-cancel">Indietro</a>
            <a href="#" class="btn btn-submit" id="confirm-btn">Conferma</a>
        </div>
    </div>

    <script>
        // Calendar Logic
        const calendarGrid = document.getElementById('calendar-grid');
        const monthDisplay = document.getElementById('current-month-display');
        const timeGrid = document.getElementById('time-grid');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');

        let currentDate = new Date();
        let selectedDate = null;
        let selectedTime = null;

        const weekDays = ['LUN', 'MAR', 'MER', 'GIO', 'VEN', 'SAB', 'DOM'];
        const months = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

        function initCalendar() {
            renderHeader();
            renderDays();
            renderTimeSlots();
        }

        function renderHeader() {
            monthDisplay.textContent = `${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
        }

        function renderDays() {
            calendarGrid.innerHTML = '';

            // Add Day Headers
            weekDays.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.classList.add('weekday');
                dayEl.textContent = day;
                calendarGrid.appendChild(dayEl);
            });

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // First day of month. 0 is Sunday, so we adjust to make Monday 0
            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            // Empty slots for previous month
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day', 'empty');
                calendarGrid.appendChild(emptyCell);
            }

            // Days
            for (let i = 1; i <= daysInMonth; i++) {
                const dayEl = document.createElement('div');
                dayEl.classList.add('day');
                dayEl.textContent = i;

                // Helper to check same day
                const checkDate = new Date(year, month, i);

                // Past dates check
                const todayZero = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                if (checkDate < todayZero) {
                    dayEl.classList.add('disabled');
                } else {
                    dayEl.addEventListener('click', () => selectDay(i));
                }

                // Is Today?
                if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayEl.classList.add('today');
                }

                // Is Selected?
                if (selectedDate &&
                    selectedDate.getDate() === i &&
                    selectedDate.getMonth() === month &&
                    selectedDate.getFullYear() === year) {
                    dayEl.classList.add('selected');
                }

                calendarGrid.appendChild(dayEl);
            }
        }

        function selectDay(day) {
            selectedDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), day);
            renderDays();
            // Reset time selection when changing day (optional logic)
            selectedTime = null;
            renderTimeSlots();
        }

        function renderTimeSlots() {
            timeGrid.innerHTML = '';

            const startHour = 8;
            const endHour = 20;

            for (let h = startHour; h <= endHour; h++) {
                // Format hour like 08:00
                const hourString = h.toString().padStart(2, '0') + ':00';

                const timeEl = document.createElement('div');
                timeEl.classList.add('time-slot');
                timeEl.textContent = hourString;

                if (selectedTime === hourString) {
                    timeEl.classList.add('selected');
                }

                // Visual feedback only if a day is selected (optional UX choice, making it cleaner)
                if (selectedDate) {
                    timeEl.addEventListener('click', () => {
                        selectedTime = hourString;
                        renderTimeSlots();
                    });
                } else {
                    // Make it look disabled if no day selected? 
                    // For simplicity, let's allow selection but maybe we should enforce day first.
                    // For now, let's just allow it for fluid UX.
                    timeEl.addEventListener('click', () => {
                        selectedTime = hourString;
                        renderTimeSlots();
                    });
                }

                timeGrid.appendChild(timeEl);
            }
        }

        // Navigation Events
        prevMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderHeader();
            renderDays();
        });

        nextMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderHeader();
            renderDays();
        });

        // Initialize
        initCalendar();

    </script>
</body>

</html>
